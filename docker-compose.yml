services:
  app:
    image: db-playground-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CHAT_DB_PATH: /data/chat.sqlite3
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LOGTO_APP_ID: ${LOGTO_APP_ID:-}
      LOGTO_APP_SECRET: ${LOGTO_APP_SECRET:-}
      LOGTO_SESSION_SECRET: ${LOGTO_SESSION_SECRET:-}
      LOGTO_REDIRECT_URI: ${LOGTO_REDIRECT_URI:-}
    volumes:
      - chat_data:/data
    ports:
      - "127.0.0.1:4998:5000"
    networks:
      - dbplayground-backend
      - infra-net
    restart: unless-stopped

